name: drone-agent-cloud
services:
  sitl:
    image: ${DRONE_SITL_IMAGE:?verified image required}
    pull_policy: never
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    environment:
      HEADLESS: "1"
      PX4_SIM_MODEL: gz_x500
      PX4_GZ_WORLD: default
      # D062: the idle simulator never flies, so it does not log at all; PX4's log-from-boot default grew about 1 GB per
      # hour here. -1, not 0: setting a parameter to its firmware default (0) is a reset in PX4, which the SITL
      # startup's later set-default of 1 then overrides. Evaluation overlays do not include this file.
      # D062：空闲仿真从不飞行，所以完全不记录；PX4 从启动即记录的默认值在这里约每小时增长 1 GB。用 -1 而不是 0：
      # 把参数设为固件默认值（0）在 PX4 中等于复位，随后 SITL 启动脚本的 set-default 1 会覆盖它。评测覆盖文件不叠加本文件。
      PX4_PARAM_SDLOG_MODE: "-1"
    volumes:
      - ${DRONE_ARTIFACTS:?owned artifact path required}:/artifacts
    networks: [simulation]
    healthcheck:
      test: ["CMD", "pgrep", "-x", "px4"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    stop_grace_period: 15s
  checks:
    profiles: [checks]
    image: ${DRONE_CHECKS_IMAGE:?checks image required}
    pull_policy: never
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    volumes:
      - ${DRONE_CHECK_ARTIFACTS:?owned artifact path required}:/artifacts
    network_mode: none
networks:
  simulation:
    internal: true
