[project]
name = "drone-agent"
version = "0.1.0"
description = "Safety-constrained mission runtime for air-ground heterogeneous robots, drone-first"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "SuperdeMan" }]
dependencies = [
    # M2 (D030): Ed25519 approval signatures verified onboard; mTLS certificates for the uplink.
    # M2（D030）：机载验证 Ed25519 审批签名；uplink 的 mTLS 证书。
    "cryptography>=46",
    # M3 (D046): the Zenoh FleetTransport beside the M2 gRPC one; pinned because the ACL and TLS config keys
    # are version-specific. / M3（D046）：与 M2 gRPC 并列的 Zenoh FleetTransport；ACL 与 TLS 配置键随版本变化，
    # 故精确固定。
    "eclipse-zenoh==1.9.0",
    "grpcio>=1.66",
    "jsonschema>=4.23,<5",
    "mcap>=1.2,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # P2 (D057): workflow schedules resolve IANA time zones from this pinned database on every platform, so the same
    # template gives the same occurrences on Windows and in the Linux images.
    # P2（D057）：工作流排班在所有平台上都从这个固定版本的库解析 IANA 时区，同一模板在 Windows 与 Linux 镜像中得到
    # 相同的发生时刻。
    "tzdata>=2025.2",
    "uvicorn==0.53.0",
    # M2 (D033): pure-Python WebSocket implementation for the hri.v0 console session.
    # M2（D033）：hri.v0 控制台会话使用的纯 Python WebSocket 实现。
    "wsproto>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", { include-group = "rpc" }, { include-group = "planner" },
       { include-group = "autonomy" }]
# M1 (docs/decisions.md D008): flight-controller transport. As of 2026-09-17 PyPI ships
# mavsdk 3.17.x (gRPC wrapper + bundled mavsdk_server); the v4 native binding is documented
# upstream but not released. Adapter code stays isolated in guardian so the v4 migration
# (System() -> Mavsdk, plugin classes) is contained.
# M1（docs/decisions.md D008）：飞控传输层。2026-09-17 时 PyPI 提供的是 mavsdk 3.17.x
#（gRPC 封装 + 自带 mavsdk_server）；v4 原生绑定上游已有文档但未发布。适配器代码隔离在
# guardian 内，v4 迁移（System() -> Mavsdk、插件改为类）只影响适配器。
flight = [
    "mavsdk==3.17.4",
]
# M1: local IPC between executive and guardian (proto-first, see proto/).
# M1：executive 与 guardian 之间的本地 IPC（proto 先行，见 proto/）。
rpc = ["grpcio>=1.66", "grpcio-tools>=1.66"]
# M2: planner providers ported from embodied-agent / car-agent (D001, D029): MiniMax-M3 and other
# OpenAI-compatible vendors over plain HTTP; onboard processes never import them.
# M2：从 embodied-agent / car-agent 移植的规划器 Provider（D001、D029）：MiniMax-M3 等 OpenAI 兼容厂商走
# 普通 HTTP；机载进程从不导入。
planner = ["httpx>=0.28,<1"]
# M3 (D041): numeric code shared with the ROS 2 nodes' tests; the nodes themselves use the system numpy (D014).
# M3（D041）：ROS 2 节点测试用到的数值库；节点本身使用系统 numpy（D014）。
autonomy = ["numpy>=1.26,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_agent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
