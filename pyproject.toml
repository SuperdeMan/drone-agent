[project]
name = "drone-agent"
version = "0.1.0"
description = "Safety-constrained mission runtime for air-ground heterogeneous robots, drone-first"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "SuperdeMan" }]
dependencies = [
    "grpcio>=1.66",
    "jsonschema>=4.23,<5",
    "mcap>=1.2,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", { include-group = "rpc" }]
# M1 (docs/decisions.md D008): flight-controller transport. As of 2026-09-17 PyPI ships
# mavsdk 3.17.x (gRPC wrapper + bundled mavsdk_server); the v4 native binding is documented
# upstream but not released. Adapter code stays isolated in guardian so the v4 migration
# (System() -> Mavsdk, plugin classes) is contained.
# M1（docs/decisions.md D008）：飞控传输层。2026-09-17 时 PyPI 提供的是 mavsdk 3.17.x
#（gRPC 封装 + 自带 mavsdk_server）；v4 原生绑定上游已有文档但未发布。适配器代码隔离在
# guardian 内，v4 迁移（System() -> Mavsdk、插件改为类）只影响适配器。
flight = [
    "mavsdk==3.17.4",
]
# M1: local IPC between executive and guardian (proto-first, see proto/).
# M1：executive 与 guardian 之间的本地 IPC（proto 先行，见 proto/）。
rpc = ["grpcio>=1.66", "grpcio-tools>=1.66"]
# M2: planner providers (ported from embodied-agent, D001).
# M2：规划器 Provider（从 embodied-agent 移植，D001）。
planner = ["anthropic>=0.39", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_agent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
