# X1 S1 workflow catalog (D088) for the operations catalog x1_s1_v1: the aircraft inspects asset_mid or asset_west, a
# capture showing a block of a declared anomaly colour is suspected, the finding goes to the ground robot, and a person
# reviews both ends. The camera is the S1 x500's (160x120, 1.4 rad). Every mission still needs a human approval.
#
# X1 S1 工作流目录（D088），对应运营目录 x1_s1_v1：飞行器巡检 asset_mid 或 asset_west，采集中出现声明异常颜色的方块即为
# 疑似，发现交给地面车，并由人复核两端证据。相机为 S1 x500 的相机（160x120，1.4 rad）。每个任务仍需人工审批。
format: drone.workflow-catalog/v1
schema_version: "0.1.0"
catalog_id: x1_s1_v1
operations_catalog: x1_s1_v1
analyzers:
  anomaly_s1_v1:
    kind: deterministic
    method: anomaly_block
    colours: [orange, magenta]
workflows:
  - workflow_id: anomaly_recheck
    version: 1
    project_id: campus_x1
    title: "Site A anomaly recheck: inspect, analyse, hand the finding to the ground robot, review both ends / A 站异常复核：巡检、分析、把发现交给地面车、复核两端证据"
    inputs:
      asset: {kind: asset_id, choices: [asset_mid, asset_west]}
    triggers:
      - {trigger_id: manual, kind: manual}
    nodes:
      - {node_id: inspect, activity: submit_mission, params: {robot_id: uav_01, volume_id: campus_training, asset: {input: asset}}}
      - {node_id: await_inspection, activity: await_mission, params: {mission_from: inspect}}
      - {node_id: analyze, activity: analyze_evidence, params: {inspection_from: await_inspection, analyzer: anomaly_s1_v1, findings: true}}
      - node_id: recheck
        activity: ground_recheck
        when: [{node: analyze, output: suspected, equals: true}]
        params: {analysis_from: analyze, robot_id: ugv_01, signature: orange, size_m: 0.8, camera: {width: 160, height: 120, hfov_rad: 1.4}, ttl_s: 60}
      - {node_id: await_recheck, activity: await_recheck, params: {recheck_from: recheck}}
      - {node_id: review, activity: human_review, after: [await_recheck], requires: done, when: [{node: analyze, output: suspected, equals: true}], params: {analysis_from: analyze}}
      - {node_id: report, activity: build_report, requires: done, after: [review]}
    budget: {max_missions: 1}
