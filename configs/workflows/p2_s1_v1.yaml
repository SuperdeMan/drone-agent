# P2 workflow catalog for the PX4 SITL site and the resident desk (D057), written for the operations catalog p1_s1_v1.
# Every mission a run submits is an ordinary single-asset M2 inspection of `uav_01` that still needs its own human
# approval (D032, D050); a template or a schedule never approves a flight. Analysis is the labelled scripted fixture
# until P4, so a run proves the business chain, not recognition quality. Schedules are shipped disabled: an operator
# enables them explicitly and the enablement is recorded.
#
# PX4 SITL 站点与常驻任务台的 P2 工作流目录（D057），对应运营目录 p1_s1_v1。运行提交的每个任务都是 `uav_01` 的普通单资产
# M2 巡检，仍需各自的人工审批（D032、D050）；模板或排班从不批准飞行。P4 之前分析使用带标注的脚本夹具，因此一次运行证明的
# 是业务链路，不是识别质量。排班默认停用：由操作者显式启用，启用记录入账。
format: drone.workflow-catalog/v1
schema_version: "0.1.0"
catalog_id: p2_s1_v1
operations_catalog: p1_s1_v1
analyzers:
  scripted_fixture_v1: {kind: scripted, fixture: configs/workflows/analysis_fixture_v1.yaml}
workflows:
  - workflow_id: asset_check
    version: 1
    project_id: campus_s1
    title: "Asset check: inspect, analyze, human review, simulated work order, repair and reinspection / 资产检查：巡检、分析、人工复核、模拟工单、维修与复检"
    inputs:
      asset: {kind: asset_id, choices: [asset_red, asset_blue]}
    triggers:
      - {trigger_id: manual, kind: manual}
      - trigger_id: daily_0900
        kind: schedule
        schedule: {every: day, at: "09:00", timezone: Asia/Shanghai}
        start_window_s: 600
        inputs: {asset: asset_red}
      - {trigger_id: asset_alarm, kind: event, source: "event:campus-alarm", event_type: asset.alarm, inputs_from_event: [asset]}
    nodes:
      - {node_id: inspect, activity: submit_mission, params: {robot_id: uav_01, volume_id: campus_training, asset: {input: asset}}}
      - {node_id: await_inspection, activity: await_mission, params: {mission_from: inspect}}
      - {node_id: analyze, activity: analyze_evidence, params: {inspection_from: await_inspection, analyzer: scripted_fixture_v1}}
      - node_id: review
        activity: human_review
        when: [{node: analyze, output: suspected, equals: true}]
        params: {analysis_from: analyze}
      - node_id: work_order
        activity: create_work_order
        when: [{node: review, output: decision, equals: confirmed}]
        params: {review_from: review}
      - {node_id: await_repair, activity: await_repair, params: {order_from: work_order}}
      - node_id: reinspect
        activity: request_reinspection
        params: {order_from: work_order, repair_from: await_repair, workflow_id: asset_reinspection, version: 1, asset_input: asset}
      - {node_id: report, activity: build_report, requires: done, after: [reinspect]}
    budget: {max_missions: 1}
  - workflow_id: campus_round
    version: 1
    project_id: campus_s1
    title: "Campus round: both registered markers in series, then analysis and review / 园区巡回：两处登记标记依次巡检，再分析与复核"
    triggers:
      - {trigger_id: manual, kind: manual}
    nodes:
      - {node_id: inspect_red, activity: submit_mission, params: {robot_id: uav_01, volume_id: campus_training, asset: asset_red}}
      - {node_id: await_red, activity: await_mission, params: {mission_from: inspect_red}}
      - {node_id: inspect_blue, activity: submit_mission, requires: done, after: [await_red], params: {robot_id: uav_01, volume_id: campus_training, asset: asset_blue}}
      - {node_id: await_blue, activity: await_mission, params: {mission_from: inspect_blue}}
      - {node_id: analyze_red, activity: analyze_evidence, params: {inspection_from: await_red, analyzer: scripted_fixture_v1}}
      - {node_id: analyze_blue, activity: analyze_evidence, params: {inspection_from: await_blue, analyzer: scripted_fixture_v1}}
      - {node_id: review_red, activity: human_review, when: [{node: analyze_red, output: suspected, equals: true}], params: {analysis_from: analyze_red}}
      - {node_id: review_blue, activity: human_review, when: [{node: analyze_blue, output: suspected, equals: true}], params: {analysis_from: analyze_blue}}
      - {node_id: order_red, activity: create_work_order, when: [{node: review_red, output: decision, equals: confirmed}], params: {review_from: review_red}}
      - {node_id: order_blue, activity: create_work_order, when: [{node: review_blue, output: decision, equals: confirmed}], params: {review_from: review_blue}}
      - {node_id: report, activity: build_report, requires: done, after: [order_red, order_blue]}
    budget: {max_missions: 2}
  - workflow_id: asset_reinspection
    version: 1
    project_id: campus_s1
    title: "Reinspection after repair feedback: a new flight and analysis; closing the order is P4 / 维修反馈后的复检：新飞行与分析；关单属于 P4"
    inputs:
      asset: {kind: asset_id, choices: [asset_red, asset_blue]}
    triggers:
      - {trigger_id: reinspection, kind: internal}
    nodes:
      - {node_id: inspect, activity: submit_mission, params: {robot_id: uav_01, volume_id: campus_training, asset: {input: asset}}}
      - {node_id: await_inspection, activity: await_mission, params: {mission_from: inspect}}
      - {node_id: analyze, activity: analyze_evidence, params: {inspection_from: await_inspection, analyzer: scripted_fixture_v1}}
      - {node_id: report, activity: build_report, requires: done, after: [analyze]}
    budget: {max_missions: 1}
