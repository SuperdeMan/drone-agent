# Harness memberships for the S1 catalog p1_s1_v1 used by the cloud P1 cases (D055). The resident desk does not
# use this file: its members come from the cloud secrets directory.
#
# 云端 P1 用例所用 S1 目录 p1_s1_v1 的编排成员资格（D055）。常驻任务台不使用本文件：其成员来自云端 secrets 目录。
format: drone.project-members/v1
schema_version: "0.1.0"
members:
  - {principal: "harness:p1-operator", project_id: campus_s1, roles: [operator, approver]}
  - {principal: "harness:p1-admin", project_id: campus_s1, roles: [admin]}
  - {principal: "harness:p1-judge", project_id: campus_s1, roles: [viewer]}
  - {principal: "harness:p1-judge", project_id: legacy_m2, roles: [viewer]}
