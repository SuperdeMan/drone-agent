# P1 S0 catalog (D055): three sites, three logical docks and three logical UAVs in `campus_ops`, plus the
# `harbor_ops` fixture project that the isolation cases (P1-F13) need. Every UAV runs the real onboard
# executive/guardian/uplink with a logical flight adapter; every dock is the logical simulator
# (eval/dock_simulator.py). Nothing here is a real device, and the service refuses real backends.
# Memberships are not in this file: they are a separate trusted input (p1_members_harness.yaml for tests).
#
# P1 S0 目录（D055）：`campus_ops` 中三个站点、三个逻辑机场与三台逻辑 UAV，外加隔离用例（P1-F13）所需的
# `harbor_ops` 夹具项目。每台 UAV 运行真实的机载 executive/guardian/uplink 与逻辑飞行适配器；每个机场是逻辑
# 模拟器（eval/dock_simulator.py）。这里没有任何真实设备，服务拒绝真实后端。成员资格不在本文件：它是单独的
# 受信输入（测试使用 p1_members_harness.yaml）。
format: drone.operations-catalog/v1
schema_version: "0.1.0"
catalog_id: p1_campus_v1
legacy_project: {project_id: legacy_m2, first_party_roles: [viewer]}
default_binding: null
projects:
  campus_ops: {name: "Campus inspection, three logical sites / 园区巡检（逻辑三站）", sites: [site_a, site_b, site_c]}
  harbor_ops: {name: "Isolation fixture project / 隔离验证夹具项目", sites: [site_h]}
sites:
  site_a: {project_id: campus_ops, scene: configs/scenarios/p1_site_a_v1.yaml, max_wind_mps: 8.0}
  site_b: {project_id: campus_ops, scene: configs/scenarios/p1_site_b_v1.yaml, max_wind_mps: 8.0}
  site_c: {project_id: campus_ops, scene: configs/scenarios/p1_site_c_v1.yaml, max_wind_mps: 8.0}
  site_h: {project_id: harbor_ops, scene: configs/scenarios/p1_site_h_v1.yaml, max_wind_mps: 8.0}
docks:
  dock_a:
    site_id: site_a
    vendor: drone-agent
    model: logical-dock-v1
    serves: [uav_a]
    actions: [open_lid, close_lid, start_charge]
    backend: {kind: logical_sim, principal: "dock:p1-s0-sim"}
  dock_b:
    site_id: site_b
    vendor: drone-agent
    model: logical-dock-v1
    serves: [uav_b]
    actions: [open_lid, close_lid, start_charge]
    backend: {kind: logical_sim, principal: "dock:p1-s0-sim"}
  dock_c:
    site_id: site_c
    vendor: drone-agent
    model: logical-dock-v1
    serves: [uav_c]
    actions: [open_lid, close_lid, start_charge]
    backend: {kind: logical_sim, principal: "dock:p1-s0-sim"}
  dock_h:
    site_id: site_h
    vendor: drone-agent
    model: logical-dock-v1
    serves: [uav_h]
    actions: [open_lid, close_lid, start_charge]
    backend: {kind: logical_sim, principal: "dock:p1-s0-harbor"}
robots:
  uav_a: {site_id: site_a, dock_id: dock_a, platform: configs/platforms/px4_sitl_multirotor.yaml, execution_backend: logical_sim}
  uav_b: {site_id: site_b, dock_id: dock_b, platform: configs/platforms/px4_sitl_multirotor.yaml, execution_backend: logical_sim}
  uav_c: {site_id: site_c, dock_id: dock_c, platform: configs/platforms/px4_sitl_multirotor.yaml, execution_backend: logical_sim}
  uav_h: {site_id: site_h, dock_id: dock_h, platform: configs/platforms/px4_sitl_multirotor.yaml, execution_backend: logical_sim}
# 1 Hz reports, 3 s freshness, at most 1 s future skew, two complete reports to reconcile a new boot (09-operations §3).
# 1 Hz 报告、3 s 新鲜度、最多 1 s 未来偏差、新 boot 需两份完整报告对账（09-operations §3）。
policy: {version: p1-dispatch-v1, freshness_s: 3.0, future_skew_s: 1.0, reconcile_reports: 2, soft_reservation_s: 900, claim_ack_timeout_s: 30, result_grace_s: 5}
