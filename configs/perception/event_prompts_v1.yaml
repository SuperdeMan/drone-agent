# Event-relevance prompt set of the onboard CLIP event detector (WP-M3-15, D041, D044).
# Prompt embeddings are computed once at image build time (ros2_ws/src/da_edge_inference/build_prompts.py); at run
# time only the vision encoder runs. Every class is a candidate label, never a verdict: `relevant` marks classes worth
# an operator's attention, and `replan_trigger` classes may only raise the bounded replan of D032 / D044 (a human
# approves any resulting version). Changing a prompt, class or pin is a new prompt-set version.
#
# 机载 CLIP 事件检测的事件相关性提示集（WP-M3-15，D041，D044）。
# 提示嵌入在镜像构建时计算一次（ros2_ws/src/da_edge_inference/build_prompts.py）；运行时只跑视觉编码器。每个类别都只是
# 候选标签而不是判定：`relevant` 标出值得操作员关注的类别，`replan_trigger` 类别只能发起 D032 / D044 的有界重规划
# （由此产生的版本须人工批准）。改动提示、类别或固定值即为新的提示集版本。
