# Recovery policy graph: multirotor, campus inspection (docs/architecture/03-safety.md §3).
# Nodes are verified baseline behaviours; edges are trigger x context guards, most specific first.
# `fault_injection_scenario` names a planned scenario, never a passed run. Every M0 edge is
# DRAFT until its separate validation record binds real evidence to the current edge hash.
#
# 恢复策略图：多旋翼、园区巡检（docs/architecture/03-safety.md §3）。
# 节点是已验证的基线行为；边是触发条件 × 上下文守卫，最具体的排前面。
# `fault_injection_scenario` 是计划场景名，不是通过记录。每条 M0 边都是草稿，
# 直到独立 validation 记录把真实证据绑定到当前策略边哈希。
schema_version: "0.1.0"
policy_id: multirotor_campus
version: v1
embodiment: aerial_multirotor
nodes: [hold, rtl, land_here, land_at, handover_to_fc_failsafe]
resume_conditions:
  - observation_fresh
  - lease_valid
  - executive_heartbeat_ok
  - skill_instance_in_cancel_safe_state_or_resume
edges:
  # Heartbeat lost during takeoff: land right here. / 起飞阶段心跳丢失：就地降落。
  - trigger: executive_heartbeat_lost
    guard: { flight_phase: [takeoff] }
    target: land_here
    fault_injection_scenario: fi.heartbeat_lost.takeoff
  # Heartbeat lost in flight with healthy localization: hold, then RTL. / 飞行中心跳丢失且定位健康：悬停后返航。
  - trigger: executive_heartbeat_lost
    guard: { flight_phase: [cruise, inspect, hover], localization_healthy: true }
    target: hold
    then: rtl
    after_s: 10
    fault_injection_scenario: fi.heartbeat_lost.cruise
  # Stale observation or trajectory while in offboard: leave offboard and hold. / offboard 中观测或轨迹过期：退出 offboard 并悬停。
  - trigger: observation_stale
    guard: { control_mode: [offboard_position, offboard_velocity, offboard_trajectory] }
    target: hold
    fault_injection_scenario: fi.observation_stale.offboard
  - trigger: trajectory_stale
    guard: { control_mode: [offboard_position, offboard_velocity, offboard_trajectory] }
    target: hold
    fault_injection_scenario: fi.trajectory_stale.offboard
  # Lease expired: hold, reconcile, RTL if not renewed. / 租约过期：悬停、对账，未续期则返航。
  - trigger: lease_expired
    guard: {}
    target: hold
    then: rtl
    after_s: 30
    fault_injection_scenario: fi.lease_expired
  # Energy low: RTL if reachable, otherwise nearest safe site. / 低电：能返航则返航，否则去最近安全点。
  - trigger: energy_low
    guard: { rtl_reachable: true }
    target: rtl
    fault_injection_scenario: fi.energy_low.rtl_reachable
  - trigger: energy_low
    guard: { rtl_reachable: false }
    target: land_at
    fault_injection_scenario: fi.energy_low.rtl_unreachable
  # Predicted geofence breach: reject the intent and hold. / 预测越界：拒绝当前意图并悬停。
  - trigger: geofence_predicted_breach
    guard: {}
    target: hold
    fault_injection_scenario: fi.geofence.predicted_breach
  # Localization degraded: hold on visual if available, else hand to the FC failsafe. / 定位退化：有视觉定位则悬停，否则交给飞控失效保护。
  - trigger: localization_degraded
    guard: { visual_localization_ok: true }
    target: hold
    fault_injection_scenario: fi.localization.gnss_lost_visual_ok
  - trigger: localization_degraded
    guard: { visual_localization_ok: false }
    target: handover_to_fc_failsafe
    fault_injection_scenario: fi.localization.all_lost
  # Uplink lost while authorized to continue: DRAFT until the M1 scenario exists.
  # 上行丢失但已授权继续：M1 场景出现前为草稿。
  - trigger: uplink_lost
    guard: { authorized_to_continue: true, robot_healthy: true }
    target: hold
    fault_injection_scenario: fi.uplink_lost.authorized
    # DRAFT: continuing the authorised package after a short hold is M1 work; until the
    # scenario exists this edge stays unverified and must not ship.
    # 草稿：短暂悬停后继续已授权任务包是 M1 的工作；场景出现前这条边保持未验证，不得上线。
  - trigger: uplink_lost
    guard: { authorized_to_continue: false }
    target: hold
    then: rtl
    after_s: 15
    fault_injection_scenario: fi.uplink_lost.not_authorized
  # FC failsafe active: never fight the flight controller. / 飞控失效保护已触发：绝不与飞控对抗。
  - trigger: fc_failsafe_active
    guard: {}
    target: handover_to_fc_failsafe
    fault_injection_scenario: fi.fc_failsafe.active
  # User pause in the air: bounded hold, then RTL. / 空中暂停：有界悬停后返航。
  - trigger: user_pause
    guard: { flight_phase: [cruise, inspect, hover] }
    target: hold
    then: rtl
    after_s: 120
    fault_injection_scenario: fi.user_pause.airborne
  # User cancel: verified return path. / 用户取消：走已验证的返航路径。
  - trigger: user_cancel
    guard: {}
    target: rtl
    fault_injection_scenario: fi.user_cancel
