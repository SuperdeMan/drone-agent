# M3 policy (D042) for missions whose package names multirotor_m3@v2 (scene m3_campus_v3). Edges inherited
# from multirotor_m1@v1 keep their exact content; edges whose context is new in M3 (external mode, visual
# localization, energy reachability) carry fi.m3.* scenarios and need M3 injection records. Order matters:
# the first matching edge wins, so specific guards precede general ones. Experimental SITL policy; physical
# validation is recorded separately and never embedded here.
