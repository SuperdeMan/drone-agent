schema_version: "0.1.0"
skill_id: skill.ground.disarm
version: "0.1.0"
description: "Disarm a stationary robot in Hold; PX4 accepts a disarm while driving, so this guard is the only barrier. / 为处于 Hold 且静止的车上锁；PX4 在行驶中也接受上锁，因此本守卫是唯一屏障。"
