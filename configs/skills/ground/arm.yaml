schema_version: "0.1.0"
skill_id: skill.ground.arm
version: "0.1.0"
description: "Arm a stationary ground robot at its parking spot; a skeleton step, never planned. / 在停车位为静止的地面车解锁；骨架步骤，从不由规划生成。"
embodiments: [ground_wheeled]
required_control_modes: [mission_upload]
params_schema:
