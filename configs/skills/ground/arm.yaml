  type: object
  additionalProperties: false
  required: [parking_id]
  properties:
    parking_id: {type: string, minLength: 1}
preconditions: [package_authorized, disarmed, stationary, at_parking, localization_healthy, energy_budget_feasible, motion_lease_valid]
