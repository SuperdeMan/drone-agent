# P1 logical site c (D055). Derived from m2_campus_v2 with only the registry id and the landing pad's robot
# changed, so every prevalidated route, asset and threshold is the M2 one; a test pins the difference.
#
# P1 逻辑站点 c（D055）。由 m2_campus_v2 派生，只改登记表 ID 与降落点所属机器人，因此每条预验证航线、
# 资产与阈值都与 M2 相同；测试钉住这一差异。
schema_version: "0.1.0"
registry_id: p1_site_c_v1
frame: {frame_id: map_enu, map_version: campus_v2}
approved_volume_id: campus_training
bounds: {x: [-40, 40], y: [-40, 40], z: [-0.5, 60]}
volumes:
  campus_training:
    bounds: {x: [-40, 40], y: [-40, 40], z: [-0.5, 60]}
    airspace_mode: simulation
    description: "Open training volume over the campus test field / 园区试验场上方的开放训练体积"
  campus_rooftop:
    bounds: {x: [40, 80], y: [-20, 20], z: [-0.5, 30]}
    airspace_mode: real
    description: "Rooftop plant area pending airspace filing; never admitted in M2 / 屋顶设备区，待空域报备，M2 不准入"
routes:
  inspection: [[0, 4, 4], [4, 4, 4]]
  return: [[0, 4, 4], [0, 0, 4]]
  observe_red: [[0, 4, 4], [4, 4, 4]]
  observe_blue: [[0, 4, 4], [-4, 6, 4]]
home: {id: home_v1, position: [0, 0, 4]}
landing_sites:
  home_pad: {position: [0, 0, 0], radius_m: 2, reserved_for: uav_c}
assets:
  asset_red:
    position: [4, 4, 0]
    camera_id: cam_0
    visual_signature: red
    size_m: 2
    volume: campus_training
    observation_route: observe_red
    kind: equipment_marker
    description: "Red equipment marker east of the pad / 起降点东侧的红色设备标记"
  asset_blue:
    position: [-4, 6, 0]
    camera_id: cam_0
    visual_signature: blue
    size_m: 2
    volume: campus_training
    observation_route: observe_blue
    kind: equipment_marker
    description: "Blue equipment marker north-west of the pad / 起降点西北侧的蓝色设备标记"
thresholds:
  takeoff: {tolerance_m: 0.7, hold_duration_s: 2}
  route: {tolerance_m: 1.3, hold_duration_s: 0.5}
  approach: {tolerance_m: 1.3, hold_duration_s: 1}
  return_home: {tolerance_m: 1.3, hold_duration_s: 2}
  land: {tolerance_m: 0.5, hold_duration_s: 2}
  above_asset_m: 2
  image:
    min_width: 160
    min_height: 120
    max_age_s: 0.5
    max_position_variance: 9
    min_red_fraction: 0.02
    max_red_fraction: 0.8
    min_signature_fraction: 0.02
    max_signature_fraction: 0.8
    min_edge_contrast: 0.05
supervision:
  observation_timeout_s: 0.5
  heartbeat_timeout_s: 2
  lease_duration_s: 10
  command_timeout_s: 5
  period_s: 0.1
  prediction_s: 2
  return_margin_fraction: 0.1
  max_pause_s: 120
simulation:
  speed_factor: 1
  model: x500
  camera_topic: /drone/cam_0/image
  policy_ref: multirotor_m1@v1
# Mission-level values the service fills in; the model never chooses them.
# 由服务填写的任务级取值；模型从不选择它们。
mission_defaults:
  # Content skills the planner may choose; framework skills are always added by the compiler.
  # 规划器可以选择的内容技能；框架技能总是由编译器添加。
  planner_skills: [skill.inspect.asset]
  takeoff_altitude_m_agl: 4
  approach_speed_mps: 2
  max_captures: 3
  home_ref: home_v1
  return_route_id: return
  landing_site_id: home_pad
  # 0.78 + 0.2 reserve leaves 2 % slack for battery rounding at takeoff; the SITL battery drains ~1.45 %/s,
  # so a single-asset inspection (conservative 0.77) fits and a two-asset one (0.97) does not (D034).
  # 0.78 加 0.2 余量为起飞时的电量取整留 2% 裕度；SITL 电池约每秒放电 1.45%，单资产巡检（保守 0.77）可行，
  # 双资产（0.97）不可行（D034）。
  energy_budget: {max_consumption_fraction: 0.78, reserve_fraction: 0.2}
  min_reserve_fraction: 0.2
  window_minutes: 30
  max_window_minutes: 120
  max_start_delay_minutes: 10
# Local records the read-only planner tools answer from (simulated site data, not live feeds).
# 只读规划工具据以回答的本地记录（仿真站点数据，不是实时来源）。
site_records:
  weather:
    source: simulated_site_record
    wind_mps: 2.0
    gust_mps: 3.0
    precipitation: none
    visibility_km: 10
  history: []
