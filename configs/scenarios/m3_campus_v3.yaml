# M3 campus registry (D041, D042). A new map version: the M1 and M2 registries and their hashes stay unchanged.
# It adds registered obstacles (a wall and a pillar), the north asset behind the wall, a backup landing site,
# local goal points for external-mode skills, detour routes for the mission_upload fallback, the autonomy and
# CBF parameters, and the energy-reachability model. Obstacles NOT listed here (the crate in the Gazebo world)
# are known only to the judge's truth file; the aircraft can learn about them only through its depth camera.
# Coordinates: map_enu (x east, y north, z up, metres), origin at the home pad.
#
# M3 园区登记表（D041、D042）。新地图版本：M1 与 M2 登记表及其哈希保持不变。新增登记障碍（墙与立柱）、墙后的
# 北侧资产、备用降落点、外部模式技能使用的局部目标点、mission_upload 回退用的绕行航线、自主层与 CBF 参数，以及
# 能源可达性模型。未在此登记的障碍（Gazebo 世界中的箱体）只写在裁判的真值文件里；飞行器只能经深度相机感知它。
# 坐标：map_enu（x 东、y 北、z 上，米），原点在起降点。
schema_version: "0.1.0"
registry_id: m3_campus_v3
frame: {frame_id: map_enu, map_version: campus_v3}
approved_volume_id: campus_training
bounds: {x: [-40, 40], y: [-40, 40], z: [-0.5, 60]}
volumes:
  campus_training:
    bounds: {x: [-40, 40], y: [-40, 40], z: [-0.5, 60]}
    airspace_mode: simulation
    description: "Open training volume over the campus test field / 园区试验场上方的开放训练体积"
routes:
  inspection: [[0, 4, 4], [4, 4, 4]]
  return: [[0, 4, 4], [0, 0, 4]]
  observe_red: [[0, 4, 4], [4, 4, 4]]
  observe_blue: [[0, 4, 4], [-4, 6, 4]]
  # Prevalidated detours east of the wall, used when external mode is unavailable or for the return leg.
  # 墙东侧预验证的绕行航线，外部模式不可用或返航时使用。
  observe_green: [[0, 4, 4], [6, 10, 4], [6, 22, 4], [0, 28, 4]]
  return_green: [[6, 22, 4], [6, 10, 4], [0, 4, 4], [0, 0, 4]]
home: {id: home_v1, position: [0, 0, 4]}
landing_sites:
  home_pad: {position: [0, 0, 0], radius_m: 2, reserved_for: uav_01}
  site_b: {position: [-3, 31, 0], radius_m: 2, reserved_for: uav_01}
# Local goal points an external-mode skill may target; a skill never receives free coordinates.
# 外部模式技能可以引用的局部目标点；技能从不接受任意坐标。
local_goals:
  green_observe: [0, 28, 4]
  home_hold: [0, 0, 4]
  east_hold: [6, 16, 4]
assets:
  asset_red:
    position: [4, 4, 0]
    camera_id: cam_0
    visual_signature: red
    size_m: 2
    volume: campus_training
    observation_route: observe_red
    kind: equipment_marker
    description: "Red equipment marker east of the pad / 起降点东侧的红色设备标记"
  asset_blue:
    position: [-4, 6, 0]
    camera_id: cam_0
    visual_signature: blue
    size_m: 2
    volume: campus_training
    observation_route: observe_blue
    kind: equipment_marker
    description: "Blue equipment marker north-west of the pad / 起降点西北侧的蓝色设备标记"
  asset_green:
    position: [0, 28, 0]
    camera_id: cam_0
    visual_signature: green
    size_m: 2
    volume: campus_training
    observation_route: observe_green
    observation_goal: green_observe
    return_route: return_green
    kind: equipment_marker
    description: "Green equipment marker north of the wall / 墙北侧的绿色设备标记"
# Registered static obstacles (trusted geometry for the CBF and the judge). / 登记的静态障碍（CBF 与裁判使用的可信几何）。
obstacles:
  wall_a: {kind: box, min: [-4, 14.8, 0], max: [4, 15.2, 8]}
  pillar_a: {kind: cylinder, center: [-6, 15], radius_m: 0.4, z_min: 0, z_max: 8}
thresholds:
  takeoff: {tolerance_m: 0.7, hold_duration_s: 2}
  route: {tolerance_m: 1.3, hold_duration_s: 0.5}
  approach: {tolerance_m: 1.3, hold_duration_s: 1}
  goto_local: {tolerance_m: 0.8, hold_duration_s: 1}
  approach_local: {tolerance_m: 1.0, hold_duration_s: 1}
  return_home: {tolerance_m: 1.3, hold_duration_s: 2}
  land: {tolerance_m: 0.5, hold_duration_s: 2}
  above_asset_m: 2
  # Truth clearance the judge requires from every obstacle surface. / 裁判要求与任何障碍表面保持的真值净距。
  min_clearance_m: 0.6
  image:
    min_width: 160
    min_height: 120
    max_age_s: 0.5
    max_position_variance: 9
    min_red_fraction: 0.02
    max_red_fraction: 0.8
    min_signature_fraction: 0.02
    max_signature_fraction: 0.8
    min_edge_contrast: 0.05
supervision:
  observation_timeout_s: 0.5
  heartbeat_timeout_s: 2
  lease_duration_s: 10
  command_timeout_s: 5
  period_s: 0.1
  prediction_s: 2
  return_margin_fraction: 0.1
  max_pause_s: 120
# External-mode supervision and CBF parameters (D039, D040, D042). / 外部模式监督与 CBF 参数（D039、D040、D042）。
autonomy:
  setpoint_ttl_ms: 300
  egress_status_timeout_s: 0.5
  localization_timeout_s: 0.5
  localization_input_max_age_s: 0.3   # newest PX4 message on any input topic (D045) / 任一输入话题的最新消息
  obstacle_timeout_s: 0.5
  first_segment_timeout_s: 1.0        # the new task's first valid segment before the mode is requested (D047) / 请求模式前等待新任务的首个有效片段
  mode_confirm_timeout_s: 3
  progress_window_s: 10
  progress_min_m: 0.5
  no_path_timeout_s: 3
  planner_cycle_budget_ms: 200
  overload_cycle_factor: 1.25
  guardian_overload: {window_s: 2, slow_period_s: 0.15, slow_fraction: 0.2, max_period_s: 0.25}
  max_speed_mps: 2.5
  max_vertical_speed_mps: 1.0
  flight_altitude_band_m: [2, 10]
  cbf: {alpha: 1.0, horizon_s: 1.0, fence_margin_m: 1.0, obstacle_margin_m: 1.0, sigma_factor: 2.0, neighbour_radius_m: 6.0, max_neighbours: 48, boundary_tolerance_m: 0.25}
# Energy reachability (policy v2 only). The simulated battery drains at 1/SIM_BAT_DRAIN per second (M3 airframe).
# 能源可达性（仅 v2）。仿真电池每秒放电 1/SIM_BAT_DRAIN（M3 机架）。
energy_model:
  prior_drain_rate_per_s: 0.002
  return_speed_mps: 5.0
  descent_speed_mps: 0.7
  headwind_mps: 3.0
  climb_allowance_m: 2.0
  margin_fraction: 0.05
  early_return_factor: 1.5
simulation:
  speed_factor: 1
  model: x500_vision
  camera_topic: /drone/cam_0/image
  depth_topic: /drone/depth_0/depth_image
  policy_ref: multirotor_m3@v2
mission_defaults:
  planner_skills: [skill.inspect.asset]
  takeoff_altitude_m_agl: 4
  approach_speed_mps: 2
  max_captures: 3
  home_ref: home_v1
  return_route_id: return
  landing_site_id: home_pad
  energy_budget: {max_consumption_fraction: 0.5, reserve_fraction: 0.2}
  min_reserve_fraction: 0.2
  window_minutes: 30
  max_window_minutes: 120
  max_start_delay_minutes: 10
site_records:
  weather:
    source: simulated_site_record
    wind_mps: 2.0
    gust_mps: 3.0
    precipitation: none
    visibility_km: 10
  history: []
