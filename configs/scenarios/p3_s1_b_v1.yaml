# P3 S1 site map p3_s1_b_v1 (D059, D061), generated by eval/p3_layout.py and pinned to it by a test. uav_02 is PX4 SITL
# instance 1 in the one P3 Gazebo world; this map is its local frame (origin (12, 0) in the shared frame).
# The M2 thresholds, supervision, energy budget and policy are kept; routes have the M2 shape, one leg at most 7 m.
#
# P3 S1 站点地图 p3_s1_b_v1（D059、D061），由 eval/p3_layout.py 生成并由测试钉在其上。uav_02 是同一个 P3 Gazebo 世界中的
# PX4 SITL 实例 1；本地图是其局部坐标（共享坐标原点 (12, 0)）。保留 M2 的阈值、监督、能源预算与策略；航线为 M2
# 形状，单程不超过 7 m。
schema_version: 0.1.0
registry_id: p3_s1_b_v1
frame: {frame_id: map_enu, map_version: p3_s1_b_v1}
approved_volume_id: campus_training
bounds:
  x: [-12, 10]
  y: [-6, 16]
  z: [-0.5, 30]
volumes:
  campus_training:
    bounds:
      x: [-12, 10]
      y: [-6, 16]
      z: [-0.5, 30]
    airspace_mode: simulation
    description: Open training volume over the campus test field / 园区试验场上方的开放训练体积
  campus_rooftop:
    bounds:
      x: [40, 80]
      y: [-20, 20]
      z: [-0.5, 30]
    airspace_mode: real
    description: Rooftop plant area pending airspace filing; never admitted in M2 / 屋顶设备区，待空域报备，M2 不准入
routes:
  inspection:
  - [0, 4, 4]
  - [4, 4, 4]
  return:
  - [0, 4, 4]
  - [0, 0, 4]
  observe_asset_mid:
  - [0, 4, 4]
  - [-7.0, 4.0, 4]
  observe_asset_east:
  - [0, 4, 4]
  - [4.0, 4.0, 4]
home:
  id: home_v1
  position: [0, 0, 4]
landing_sites:
  home_pad:
    position: [0, 0, 0]
    radius_m: 2
    reserved_for: uav_02
assets:
  asset_mid:
    position: [-7.0, 4.0, 0]
    camera_id: cam_0
    visual_signature: green
    size_m: 2
    volume: campus_training
    observation_route: observe_asset_mid
    kind: equipment_marker
    description: Green equipment marker / 绿色设备标记
  asset_east:
    position: [4.0, 4.0, 0]
    camera_id: cam_0
    visual_signature: blue
    size_m: 2
    volume: campus_training
    observation_route: observe_asset_east
    kind: equipment_marker
    description: Blue equipment marker / 蓝色设备标记
thresholds:
  takeoff: {tolerance_m: 0.7, hold_duration_s: 2}
  route: {tolerance_m: 1.3, hold_duration_s: 0.5}
  approach: {tolerance_m: 1.3, hold_duration_s: 1}
  return_home: {tolerance_m: 1.3, hold_duration_s: 2}
  land: {tolerance_m: 0.5, hold_duration_s: 2}
  above_asset_m: 2
  image: {min_width: 160, min_height: 120, max_age_s: 0.5, max_position_variance: 9, min_red_fraction: 0.02, max_red_fraction: 0.8,
    min_signature_fraction: 0.02, max_signature_fraction: 0.8, min_edge_contrast: 0.05}
supervision: {observation_timeout_s: 0.5, heartbeat_timeout_s: 2, lease_duration_s: 10, command_timeout_s: 5, period_s: 0.1,
  prediction_s: 2, return_margin_fraction: 0.1, max_pause_s: 120}
simulation: {speed_factor: 1, model: x500, camera_topic: /world/default/model/x500_1/link/inspection_camera/sensor/cam_0/image,
  policy_ref: multirotor_m1@v1}
mission_defaults:
  planner_skills: [skill.inspect.asset]
  takeoff_altitude_m_agl: 4
  approach_speed_mps: 2
  max_captures: 3
  home_ref: home_v1
  return_route_id: return
  landing_site_id: home_pad
  energy_budget: {max_consumption_fraction: 0.78, reserve_fraction: 0.2}
  min_reserve_fraction: 0.2
  window_minutes: 30
  max_window_minutes: 120
  max_start_delay_minutes: 10
site_records:
  weather: {source: simulated_site_record, wind_mps: 2.0, gust_mps: 3.0, precipitation: none, visibility_km: 10}
  history: []
