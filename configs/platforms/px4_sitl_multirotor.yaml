# Platform lock for the M1 simulation target (docs/decisions.md D008). Version bumps go through
# decisions.md first. `capability` is the CapabilityDescriptor the PX4 adapter publishes for this
# platform; note the honest control_modes: M1 enables mission_upload only.
#
# M1 仿真目标的平台版本锁（docs/decisions.md D008）。版本变更先记 decisions.md。
# `capability` 是 PX4 适配器为该平台发布的 CapabilityDescriptor；注意 control_modes 如实声明：
# M1 只启用 mission_upload。
schema_version: "0.1.0"
platform_id: px4_sitl_multirotor
versions:
  px4: "1.17.0"
  px4_commit: d6f12ad1c4f70ad3230afd7d86e971421e02fef4
  build_image: px4io/px4-dev-ros2@sha256:558f27556d5ddb09a5082ec5a4407e4497b3d5bed646278242488010f267ae23
  mavsdk_python: "3.17.4" # Pin the validated gRPC API; migrate explicitly (D025). / 固定已验证的 gRPC API；按 D025 显式迁移。
  gazebo: harmonic
  ros2: jazzy # M3; evaluate lyrical per D008 / M3 引入；按 D008 评估切换 lyrical
  ubuntu: "24.04"
  python: "3.12"
  # M3 (D039): external-mode interface, pinned by commit and verified by archive digest at build time.
  # M3（D039）：外部模式接口，按提交固定，构建时核对归档摘要。
  px4_ros2_cpp: {repo: Auterion/px4-ros2-interface-lib, branch: release/1.17, commit: 4a3370f084ac6f1ef001a4afa2b007845ffd0837, archive_sha256: 8cf06afdef7ef6e83c24c179728b9d78a7b4b6117ef317f2828f0b165f58d54a}
  px4_msgs: {packaging_repo: PX4/px4_msgs, packaging_commit: 86d8239e962f6939e05c3737784f60c02fa884db, archive_sha256: 36d2f2ea48f5a367976acb070ee9da0ef4cd18e9e210ed91a4bafc23ad8893e6, messages_from: px4_commit}
  micro_xrce_dds_agent: build_image
# Control modes the platform can offer when its companion process is healthy. They are never part of the static
# capability: the adapter adds them to the live CapabilityDescriptor only while the egress node is registered (D039).
# 伴飞进程健康时平台可提供的控制模式。它们从不写进静态能力：只有出口节点已注册时，适配器才把它们加进实时能力描述（D039）。
optional_control_modes: [external_mode]
capability:
  robot_id: uav_01
  embodiment: aerial_multirotor
  interface_version: "0.1.0"
  control_modes: [mission_upload]
  skills:
    - { skill_id: skill.flight.takeoff, version: "0.1.0" }
    - { skill_id: skill.flight.fly_route, version: "0.1.0" }
    - { skill_id: skill.flight.capture_image, version: "0.1.0" }
    - { skill_id: skill.flight.return_home, version: "0.1.0" }
    - { skill_id: skill.flight.land, version: "0.1.0" }
    - { skill_id: skill.inspect.asset, version: "0.1.0" } # M2 (D034) / M2（D034）
    # M3 (D039): usable only while external_mode is live. / M3（D039）：只有 external_mode 在线时可用。
    - { skill_id: skill.flight.goto_local, version: "0.1.0" }
    - { skill_id: skill.inspect.asset_local, version: "0.1.0" }
  sensors:
    - { sensor_id: gnss_0, kind: gnss, frame_id: uav_01/base_link, nominal_accuracy: { position_m: 1.5 } }
    - { sensor_id: cam_0, kind: rgb_camera, frame_id: uav_01/cam_0 }
  payloads: []
  limits:
    max_speed_mps: 8.0
    max_altitude_m_agl: 60.0
    endurance_s: 1500
    max_wind_mps: 8.0
    can_hover: true
  recovery_behaviors: [hold, rtl, land_here, land_at, handover_to_fc_failsafe]
  vendor: px4
  model: x500_sitl
  vendor_constraints: []
recovery_policy_ref: multirotor_campus@v1
