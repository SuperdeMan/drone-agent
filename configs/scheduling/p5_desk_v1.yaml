# Resident desk scheduling catalog (D059, D060, D069) for the operations catalog p5_desk_v1. The four sites lie in
# different simulated worlds (PX4 SITL, two logical sites, the vendor simulator), so their origins are far apart in the
# shared frame and no two sites ever contend for the same airspace cell. Only `fleet_s0` submits tasks (its two logical
# aircraft); every assigned mission is still approved one by one, and an unclaimed assignment is withdrawn after a
# minute as on the P3 desk.
#
# 常驻任务台调度目录（D059、D060、D069），对应运营目录 p5_desk_v1。四个站点位于不同的模拟世界（PX4 SITL、两个逻辑站点、厂商
# 模拟器），因此它们在共享坐标中的原点相距很远，任何两个站点都不会争用同一空域单元。只有 `fleet_s0` 提交任务单（其两台逻辑
# 飞行器）；每个已分配任务仍逐个审批，未领取的分配与 P3 任务台一样在一分钟后撤回。
format: drone.scheduling-catalog/v1
schema_version: "0.1.0"
catalog_id: p5_desk_v1
operations_catalog: p5_desk_v1
airspace:
  frame: desk_p5
  cell_m: 4.0
  buffer_m: 2.0
  contact_timeout_s: 5.0
  envelope_margin_m: 2.0
  sites:
    site_s1: {origin: [0, 0]}
    site_fa: {origin: [1000, 0]}
    site_fb: {origin: [2000, 0]}
    site_vd: {origin: [3000, 0]}
ranking: {version: p3-rank-v1, cruise_mps: 2.0, setup_s: 20.0, usage_window_s: 3600.0}
policy: {version: p3-sched-v1, reassign_after_s: 60.0, max_assignments: 4, task_window_s: 1800.0, max_tasks_per_pass: 50}
