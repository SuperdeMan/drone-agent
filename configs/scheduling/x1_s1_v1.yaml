# X1 S1 scheduling catalog (D088) for the operations catalog x1_s1_v1: site a at the world origin and the ground site g
# at the rover's parking spot (2, -4), which the ground layer also names for the rover's map; site a's apron is held by
# the aircraft and by every ground mission whose path meets it. Cells and the lost-contact rule are P3's.
#
# X1 S1 调度目录（D088），对应运营目录 x1_s1_v1：站点 a 在世界原点，地面站点 g 在地面车停车位 (2, -4)，地面层为地面车地图写明
# 同一位置；站点 a 的起降区由飞行器与路径经过它的每个地面任务持有。单元与失联规则沿用 P3。
format: drone.scheduling-catalog/v1
schema_version: "0.1.0"
catalog_id: x1_s1_v1
operations_catalog: x1_s1_v1
airspace:
  frame: campus_x1
  cell_m: 4.0
  buffer_m: 2.0
  contact_timeout_s: 5.0
  envelope_margin_m: 2.0
  sites:
    site_s1a: {origin: [0, 0]}
    site_s1g: {origin: [2, -4]}
ranking: {version: p3-rank-v1, cruise_mps: 2.0, setup_s: 20.0, usage_window_s: 3600.0}
policy: {version: p3-sched-v1, reassign_after_s: 20.0, max_assignments: 4, task_window_s: 1800.0, max_tasks_per_pass: 50}
ground:
  maps:
    x1_ground_s1_v1: {site: site_s1a, origin: [2, -4]}
  shared:
    pad_a: {site: site_s1a, polygon: [[-3, -3], [3, -3], [3, 3], [-3, 3]]}
