# P3 S1 scheduling catalog (D059, D061) for the operations catalog p3_s1_v1: the shared frame `campus_p3` is the Gazebo
# world frame, `uav_01`'s site map lies at its origin and `uav_02`'s 12 m east. Same 4 m cells and 2 m buffer as S0, so
# `mid` from uav_01 and `east` from uav_02 stay apart (they fly at once) while `mid` from both meets (they take turns).
# A PX4 flight publishes its status every second, so 5 s of silence after a claim grows that aircraft's envelope. The
# reassignment delay is longer than in S0 because a SITL approval and claim take tens of seconds.
#
# P3 S1 调度目录（D059、D061），对应运营目录 p3_s1_v1：共享坐标 `campus_p3` 即 Gazebo 世界坐标，`uav_01` 的站点地图位于原点，
# `uav_02` 的位于其东 12 m。单元 4 m、缓冲 2 m 与 S0 相同，因此 uav_01 的 `mid` 与 uav_02 的 `east` 互不相交（同时飞行），
# 两机的 `mid` 相交（轮流执行）。PX4 飞行每秒发布状态，因此领取后 5 s 无消息即开始增长该机的包络。改派延迟长于 S0，因为 SITL
# 的审批与领取需要数十秒。
format: drone.scheduling-catalog/v1
schema_version: "0.1.0"
catalog_id: p3_s1_v1
operations_catalog: p3_s1_v1
airspace:
  frame: campus_p3
  cell_m: 4.0
  buffer_m: 2.0
  contact_timeout_s: 5.0
  envelope_margin_m: 2.0
  sites:
    site_s1a: {origin: [0, 0]}
    site_s1b: {origin: [12, 0]}
ranking: {version: p3-rank-v1, cruise_mps: 2.0, setup_s: 20.0, usage_window_s: 3600.0}
policy: {version: p3-sched-v1, reassign_after_s: 20.0, max_assignments: 4, task_window_s: 1800.0, max_tasks_per_pass: 50}
