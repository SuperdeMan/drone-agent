# P6 business catalog for PX4 SITL (D078), written for the operations catalog p1_s1_v1 and the workflow catalog
# p6_s1_v1. The P4 S1 policies stay as they were (no vision model is configured here); analyses use the S1
# target-region profile, and recapture-v1 lists every reason a flight of the same pose can change.
#
# PX4 SITL 的 P6 业务目录（D078），对应运营目录 p1_s1_v1 与工作流目录 p6_s1_v1。P4 S1 的各项策略不变（这里不配置视觉
# 模型）；分析使用 S1 目标区域画像，recapture-v1 列出同一拍摄位的再次飞行可以改变的全部原因。
format: drone.business-catalog/v1
schema_version: "0.1.0"
catalog_id: p6_s1_v1
operations_catalog: p1_s1_v1
workflow_catalog: p6_s1_v1
default_quality: configs/analysis/quality_target_s1_v1.yaml
families:
  appearance: [damage, missing_part, contamination, deformation, discoloration, foreign_object, other_change]
generic_defect: other_change
closure: {version: reinspection-v1, allowed_sources: [deterministic, live_model, recorded_model]}
reuse: {version: reuse-v1, max_age_s: 604800, analyzers: [signature_s1_v1]}
runner: {concurrency: 2, lease_s: 60, max_attempts: 2, daily_tokens: 0}
max_references: 3
recapture:
  version: recapture-v1
  reasons: [quality.blurry, quality.exposure, quality.target_out_of_frame, quality.target_off_center,
            quality.target_exposure, quality.target_blurry, analysis.undeterminable]
