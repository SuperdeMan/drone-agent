# X1 S0 business catalog (D088) for the operations catalog x1_campus_v1 and its workflow catalog: the P4 appearance
# families, closure and reuse rules over the deterministic signature analyzer. The ground recheck adds no model: its
# relocation is the deterministic anomaly locator's.
#
# X1 S0 业务目录（D088），对应运营目录 x1_campus_v1 及其工作流目录：在确定性特征分析器之上沿用 P4 的外观类别、关单与复用
# 规则。地面复核不加入任何模型：重新定位由确定性异常定位器完成。
format: drone.business-catalog/v1
schema_version: "0.1.0"
catalog_id: x1_campus_v1
operations_catalog: x1_campus_v1
workflow_catalog: x1_campus_v1
default_quality: configs/analysis/quality_sim_v1.yaml
families:
  appearance: [damage, missing_part, contamination, deformation, discoloration, foreign_object, other_change]
generic_defect: other_change
closure: {version: reinspection-v1, allowed_sources: [deterministic, scripted, live_model, recorded_model]}
reuse: {version: reuse-v1, max_age_s: 604800, analyzers: [signature_s0_v1]}
runner: {concurrency: 2, lease_s: 8, max_attempts: 2, daily_tokens: 2000000}
max_references: 3
