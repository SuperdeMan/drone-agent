  status: "calibrated on the calibration split, frozen by D076 / 在校准拆分上标定，由 D076 冻结"
  run: 20261009T164305Z-47707fde/p4-20261009T234043Z-e3898695
  source_sha: 9638109651708291bec69d12c97b768069e10c2d
  samples: "360"
  rule: "smallest grid tau with calibration precision >= 0.92; between change-v5 and change-v6 the higher recall at that tau (D076 §4) / 校准精确率 >= 0.92 的最小网格值；change-v5 与 change-v6 之间取该 τ 下召回率更高者（D076 §4）"
  precision: "0.9495"
  recall: "0.7833"
  coverage: "0.9964"
  false_assurance: "0.0"
  compared: "change-v5 run 20261009T164305Z-47707fde/p4-20261009T170110Z-82907415: tau 0.95, precision 0.949, recall 0.775"
