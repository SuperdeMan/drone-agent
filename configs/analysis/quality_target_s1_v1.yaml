# P6 target-region quality profile for the S1 Gazebo renders (D078). The whole-frame limits are those of
# quality_sim_v1. The camera is the one the simulation image mounts under the x500 (sim/m1_setup.py): 160x120, a
# horizontal field of view of 1.4 rad, 0.15 m below the vehicle origin, looking straight down; the 2 m marker seen
# from 4 m spans about 49 px. The target limits keep the P4 damage patch (a dark band over about 60% of the core)
# analysable and refuse the P6 glare disc (an emissive white disc over most of the core); they are properties of the
# simulated renders, not detectors; the S1 calibration run (D078) measures the renders before any counted run.
#
# S1 Gazebo 渲染的 P6 目标区域质量画像（D078）。整图限值与 quality_sim_v1 相同。相机为仿真镜像挂在 x500 下方的相机
# （sim/m1_setup.py）：160x120、水平视场角 1.4 rad、位于飞行器原点下方 0.15 m、垂直向下；从 4 m 看 2 m 的标记约占 49 像素。
# 目标限值使 P4 损伤贴片（覆盖约 60% 核心的暗带）仍可分析，并拒判 P6 反光圆片（覆盖大部分核心的自发光白色圆片）；它们是
# 模拟渲染的属性，不是检测器；S1 标定运行（D078）在任何计入的运行之前测量渲染。
format: drone.quality-profile/v2
schema_version: "0.1.0"
profile_id: quality_target_s1
version: 1
note: "S1 Gazebo renders from the simulation image's nadir camera (D078) / 仿真镜像下视相机的 S1 Gazebo 渲染（D078）"
min_width: 160
min_height: 120
luminance: [20.0, 235.0]
max_clipped_fraction: 0.35
min_sharpness: 8.0
camera: {camera_id: cam_0, width: 160, height: 120, hfov_rad: 1.4, mount_below_m: 0.15}
target:
  min_visible_fraction: 0.95
  min_side_px: 24
  min_core_px: 150
  dark_level: 40
  max_dark_fraction: 0.9
  bright_level: 245
  max_bright_fraction: 0.5
  min_sharpness: 8.0
