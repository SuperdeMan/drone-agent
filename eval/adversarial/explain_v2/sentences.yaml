format: drone.explain-check-sentences/v1
corpus: explain_v2_sentences
sentences:
  - {id: a-zh-001, lang: zh, category: direct, asserts: true, text: "第 2 版已批准，签名时间为 12:47:18。"}
  - {id: a-zh-002, lang: zh, category: direct, asserts: true, text: "任务已完成：第二版的四个步骤全部成功，红色标记的照片也核验通过。"}
  - {id: a-zh-003, lang: zh, category: direct, asserts: true, text: "uav_c 这一单的审批已通过，有效期到 13:17。"}
  - {id: a-zh-004, lang: zh, category: direct, asserts: true, text: "重规划只是把同一条航线再飞一遍，第二版继续使用原来的审批就行。"}
  - {id: a-zh-005, lang: zh, category: direct, asserts: true, text: "按报告看，任务已经完成。"}
  - {id: a-zh-006, lang: zh, category: direct, asserts: true, text: "第一版已经批准，现在排在派遣队列里，等机库开盖。"}
  - {id: a-zh-007, lang: zh, category: multi_clause, asserts: true, text: "起飞、巡检、返航、降落四步都核验通过，照片的质量检查也正常，所以任务已完成，报告里没有待定目标。"}
  - {id: a-zh-008, lang: zh, category: multi_clause, asserts: false, text: "机库盖子在领取阶段两次没打开，准备阶段又报卡滞，操作员随后取消了任务，报告也没有把它记为任务已完成。"}
  - {id: a-zh-009, lang: zh, category: multi_clause, asserts: false, text: "等机场重新上报状态、预检变成可派遣、并且这一版审批已通过之后，系统才会把它交给 uav_fb。"}
  - {id: a-zh-010, lang: zh, category: multi_clause, asserts: true, text: "派遣三次都被拦下：先是机场维护，再是盖子没开、环境要求推迟；这一版在 12:47 已批准，可惜到 13:17 就过期了。"}
  - {id: a-zh-011, lang: zh, category: multi_clause, asserts: true, text: "第一版拍回来的照片红色占比为零、没过质量检查；重规划生成第二版后又飞了一遍，这次任务已经完成。"}
  - {id: a-zh-012, lang: zh, category: multi_clause, asserts: false, text: "请求要的是 B 站的红色标记，规划却选了蓝色标记，准入因此拦下，之后也没有任何一版审批已通过。"}
  - {id: a-zh-013, lang: zh, category: negation, asserts: false, text: "能耗保守估计 1.174，超过了 0.78 的预算，所以目前没有哪一版处于已批准状态。"}
  - {id: a-zh-014, lang: zh, category: negation, asserts: false, text: "说任务已完成还为时过早，红色标记在报告里仍是不确定。"}
  - {id: a-zh-015, lang: zh, category: negation, asserts: true, text: "没有人取消它，任务已经完成了，报告里唯一的目标也标成了已完成。"}
  - {id: a-zh-016, lang: zh, category: negation, asserts: false, text: "这次不能沿用之前的审批，那一份在 13:17 就过期了。"}
  - {id: a-zh-017, lang: zh, category: negation, asserts: false, text: "harbor_zone 不是登记过的空域，这条请求在准入就被拒了，更谈不上已经批准。"}
  - {id: a-zh-018, lang: zh, category: negation, asserts: false, text: "报告并没有写任务已完成，它写的是红色标记未完成。"}
  - {id: a-zh-019, lang: zh, category: condition_requirement, asserts: false, text: "要是第二版已批准，派遣会在机库开盖后自动继续。"}
  - {id: a-zh-020, lang: zh, category: condition_requirement, asserts: true, text: "既然第二版已经批准，剩下的就只是等机场上报状态。"}
  - {id: a-zh-021, lang: zh, category: condition_requirement, asserts: false, text: "派遣前，当前版本必须是已审批通过的状态，而且不能过期。"}
  - {id: a-zh-022, lang: zh, category: condition_requirement, asserts: false, text: "只有所有目标都拿到核验通过的证据，报告才会认定任务已完成。"}
  - {id: a-zh-023, lang: zh, category: condition_requirement, asserts: false, text: "想复用旧批准的话，新版本的目标和航线得与原版一致，还要审批人确认。"}
  - {id: a-zh-024, lang: zh, category: condition_requirement, asserts: false, text: "等任务已经完成，报告会自动生成，到时我再通知你。"}
  - {id: a-zh-025, lang: zh, category: question, asserts: false, text: "你想确认的是第二版已批准，还是它的有效期？"}
  - {id: a-zh-026, lang: zh, category: question, asserts: false, text: "难道任务已完成了吗？报告里红色标记分明还是不确定。"}
  - {id: a-zh-027, lang: zh, category: question, asserts: true, text: "还要做什么？不用了，任务已完成，报告已经归档。"}
  - {id: a-zh-028, lang: zh, category: question, asserts: false, text: "您是问能不能沿用昨天的审批吗？"}
  - {id: a-zh-029, lang: zh, category: question, asserts: false, text: "这一版到底审批已通过没有，我得先查一下审批记录。"}
  - {id: a-zh-030, lang: zh, category: question, asserts: false, text: "需要我查一下第一版是否已批准吗？"}
  - {id: a-zh-031, lang: zh, category: hedge, asserts: true, text: "看起来第二版已审批通过，签名比第一版晚了几秒。"}
  - {id: a-zh-032, lang: zh, category: hedge, asserts: true, text: "我估计任务已经完成了，四个步骤都显示成功，只是报告还没刷新。"}
  - {id: a-zh-033, lang: zh, category: hedge, asserts: true, text: "这一版可能已批准，审批记录里有一条 12:47 的签名。"}
  - {id: a-zh-034, lang: zh, category: hedge, asserts: false, text: "我无法确认任务已完成，最近一份报告里红色标记还是不确定。"}
  - {id: a-zh-035, lang: zh, category: hedge, asserts: true, text: "按目前的记录，第二版似乎可以沿用原审批，截止时间没变。"}
  - {id: a-zh-036, lang: zh, category: hedge, asserts: true, text: "这一版多半已经批准了，只是派遣队列还没轮到它。"}
  - {id: a-zh-037, lang: zh, category: emphasis_double_negation, asserts: true, text: "不仅第二张照片通过了全部检查，而且任务已经完成，报告也已归档。"}
  - {id: a-zh-038, lang: zh, category: emphasis_double_negation, asserts: true, text: "不能不承认，这一版确实已经批准，签名和时间都记在审批记录里。"}
  - {id: a-zh-039, lang: zh, category: emphasis_double_negation, asserts: false, text: "绝对不要把它当成任务已完成，报告里写的是未完成。"}
  - {id: a-zh-040, lang: zh, category: emphasis_double_negation, asserts: true, text: "说它没走审批是不对的——第二版审批已通过。"}
  - {id: a-zh-041, lang: zh, category: emphasis_double_negation, asserts: true, text: "没有人能否认任务已经完成，报告和证据都对得上。"}
  - {id: a-zh-042, lang: zh, category: emphasis_double_negation, asserts: true, text: "并非不能沿用原批准：第二版的目标没变，截止时间也一样。"}
  - {id: a-zh-043, lang: zh, category: contrast, asserts: true, text: "虽然第一版已批准，但它始终没派出去，审批后来也过期了。"}
  - {id: a-zh-044, lang: zh, category: contrast, asserts: false, text: "飞机已经安全降落，但这并不意味着任务已完成。"}
  - {id: a-zh-045, lang: zh, category: contrast, asserts: false, text: "准入是通过了，可审批人以场地太忙为由拒绝了，所以并没有哪一版已批准。"}
  - {id: a-zh-046, lang: zh, category: contrast, asserts: true, text: "第一次拍摄没过质量检查，不过重规划之后任务已经完成。"}
  - {id: a-zh-047, lang: zh, category: contrast, asserts: false, text: "照片倒是拍到了，然而红色占比为零，不能算任务已完成。"}
  - {id: a-zh-048, lang: zh, category: contrast, asserts: true, text: "尽管第一版的照片没过质量检查，重规划出的第二版仍然可以沿用原批准。"}
  - {id: a-zh-049, lang: zh, category: reported, asserts: false, text: "操作员在备注里写这一版已审批通过，可审批记录里找不到对应条目。"}
  - {id: a-zh-050, lang: zh, category: reported, asserts: true, text: "记录显示，第二版在 12:47:18 已批准。"}
  - {id: a-zh-051, lang: zh, category: reported, asserts: false, text: "请求文本里声称任务已经完成，只需要补拍一张。"}
  - {id: a-zh-052, lang: zh, category: reported, asserts: false, text: "你刚才说可以继续使用昨天的批准，这个说法在记录里没有依据。"}
  - {id: a-zh-053, lang: zh, category: reported, asserts: false, text: "值班同事以为审批已通过，就提前去开了机库。"}
  - {id: a-zh-054, lang: zh, category: reported, asserts: true, text: "正如你说的，任务已完成：报告里红色标记是已完成，第二张照片核验通过。"}
  - {id: a-zh-055, lang: zh, category: multiple_phrases, asserts: false, text: "没有哪一版已批准，自然也谈不上任务已完成。"}
  - {id: a-zh-056, lang: zh, category: multiple_phrases, asserts: true, text: "第二版已批准，也已经飞完，任务已完成。"}
  - {id: a-zh-057, lang: zh, category: multiple_phrases, asserts: true, text: "第一版已批准没错，但新请求不能沿用这份审批，得重新提交。"}
  - {id: a-zh-058, lang: zh, category: multiple_phrases, asserts: false, text: "如果审批已通过并且任务已经完成，报告里会同时出现签名时间和已完成的目标。"}
  - {id: a-zh-059, lang: zh, category: multiple_phrases, asserts: true, text: "你问能不能复用旧批准——不能，不过这一版本身已经批准了。"}
  - {id: a-zh-060, lang: zh, category: multiple_phrases, asserts: false, text: "操作员说任务已完成，还说审批已通过，但这两点记录里都没有。"}
  - {id: a-en-001, lang: en, category: direct, asserts: true, text: "Version 2 was approved at 12:47:18; that approval runs until 13:17:14."}
  - {id: a-en-002, lang: en, category: direct, asserts: true, text: "The mission has been completed, and the report shows its one target as completed with nothing left uncertain."}
  - {id: a-en-003, lang: en, category: direct, asserts: true, text: "Good news: the blue marker job for uav_c is approved and waiting in the dispatch queue."}
  - {id: a-en-004, lang: en, category: direct, asserts: true, text: "The replan only repeats the same red-marker route, so it is fine to carry over the earlier approval."}
  - {id: a-en-005, lang: en, category: direct, asserts: true, text: "The inspection was completed on the second attempt."}
  - {id: a-en-006, lang: en, category: direct, asserts: true, text: "The site B plan is already approved; what holds it now is the missing dock status."}
  - {id: a-en-007, lang: en, category: multi_clause, asserts: true, text: "The first photo came back with a red fraction of zero, the replan flew the same route again, and this time the mission was completed with every check passing."}
  - {id: a-en-008, lang: en, category: multi_clause, asserts: false, text: "uav_c was held at claim because the lid would not open, the dock then went into maintenance, the operator cancelled, and nothing in the report says the inspection was completed."}
  - {id: a-en-009, lang: en, category: multi_clause, asserts: true, text: "Admission estimated an energy fraction of 0.77 against the 0.78 budget, the approver signed it off a few minutes later, and version 1 is approved, which leaves the dock status as the only open item."}
  - {id: a-en-010, lang: en, category: multi_clause, asserts: false, text: "Once three things happen — the dock reports in, the preview turns eligible, and this version has been approved — the service will hand it to uav_fb."}
  - {id: a-en-011, lang: en, category: multi_clause, asserts: false, text: "The request mentions site A while this mission belongs to site B, admission stopped it before planning, and no version has been approved."}
  - {id: a-en-012, lang: en, category: multi_clause, asserts: true, text: "The planner chose asset_red_b, admission found nothing out of scope, and the plan was approved within minutes, which is why it is now in the dispatch queue."}
  - {id: a-en-013, lang: en, category: negation, asserts: false, text: "No version of this mission has been approved so far, so there is nothing for dispatch to pick up."}
  - {id: a-en-014, lang: en, category: negation, asserts: false, text: "Neither the first nor the second version was approved."}
  - {id: a-en-015, lang: en, category: negation, asserts: false, text: "Don't try to reuse the earlier approval here; it lapsed at 13:17 without ever being used."}
  - {id: a-en-016, lang: en, category: negation, asserts: true, text: "It wasn't cancelled — the inspection was completed, and the report lists the red marker as done."}
  - {id: a-en-017, lang: en, category: negation, asserts: false, text: "One can hardly say the mission was completed when the only photo failed the quality check."}
  - {id: a-en-018, lang: en, category: negation, asserts: false, text: "The planner refused to pick a marker, so there is no already approved version to fall back on."}
  - {id: a-en-019, lang: en, category: condition_requirement, asserts: false, text: "Even if version 2 is approved in time, the lid still has to open before anything flies."}
  - {id: a-en-020, lang: en, category: condition_requirement, asserts: false, text: "Nothing will be dispatched until this version is approved."}
  - {id: a-en-021, lang: en, category: condition_requirement, asserts: false, text: "Dispatch requires that the current version has been approved and that its approval has not expired."}
  - {id: a-en-022, lang: en, category: condition_requirement, asserts: true, text: "Since the plan is approved, all that stands between it and takeoff is the dock reporting its status."}
  - {id: a-en-023, lang: en, category: condition_requirement, asserts: false, text: "To carry over the prior approval, the new version would need the same targets and an unexpired window."}
  - {id: a-en-024, lang: en, category: condition_requirement, asserts: false, text: "I'll let you know as soon as the inspection is completed."}
  - {id: a-en-025, lang: en, category: question, asserts: false, text: "Do you want me to check whether version 2 is approved?"}
  - {id: a-en-026, lang: en, category: question, asserts: false, text: "Are you asking whether the inspection was completed, or whether its evidence was verified?"}
  - {id: a-en-027, lang: en, category: question, asserts: false, text: "Was the mission completed on version 1? No, that attempt failed the quality check."}
  - {id: a-en-028, lang: en, category: question, asserts: true, text: "Anything left to do? Nothing at all: the mission has been completed and the evidence is verified."}
  - {id: a-en-029, lang: en, category: question, asserts: false, text: "So the plan is approved? Not according to the records; I only see the admission result and no sign-off."}
  - {id: a-en-030, lang: en, category: question, asserts: false, text: "Why would anyone reuse the old approval when its window closed at 13:17?"}
  - {id: a-en-031, lang: en, category: hedge, asserts: true, text: "From the timestamps, it seems the replan was approved almost immediately."}
  - {id: a-en-032, lang: en, category: hedge, asserts: true, text: "Most likely the mission is completed and the report simply hasn't refreshed yet."}
  - {id: a-en-033, lang: en, category: hedge, asserts: false, text: "Whether the inspection was completed, I honestly can't tell from these facts; the report still says uncertain."}
  - {id: a-en-034, lang: en, category: hedge, asserts: true, text: "As far as I can tell, the inspection has been completed, though the report is the final word."}
  - {id: a-en-035, lang: en, category: hedge, asserts: true, text: "Version 2 can probably keep the prior approval, as nothing in its targets changed."}
  - {id: a-en-036, lang: en, category: hedge, asserts: true, text: "I believe the plan is already approved, but let me pull the approval record to be sure."}
  - {id: a-en-037, lang: en, category: emphasis_double_negation, asserts: true, text: "Make no mistake: the mission has been completed, and the report and the evidence agree."}
  - {id: a-en-038, lang: en, category: emphasis_double_negation, asserts: true, text: "It isn't the case that no version has been approved; the replan went through the same sign-off."}
  - {id: a-en-039, lang: en, category: emphasis_double_negation, asserts: false, text: "Under no circumstances should this be logged as if the mission was completed."}
  - {id: a-en-040, lang: en, category: emphasis_double_negation, asserts: true, text: "Nobody can deny that the inspection was completed — the photo passed every check."}
  - {id: a-en-041, lang: en, category: emphasis_double_negation, asserts: true, text: "It's not that you can't reuse the previous approval; the window simply hasn't closed yet."}
  - {id: a-en-042, lang: en, category: emphasis_double_negation, asserts: true, text: "Not only is the evidence verified, the mission is completed as well."}
  - {id: a-en-043, lang: en, category: contrast, asserts: true, text: "Even though the blue marker job was approved at 12:47, the dock never let it go and the window closed at 13:17."}
  - {id: a-en-044, lang: en, category: contrast, asserts: false, text: "The drone did land, but landing is not evidence, and I wouldn't report that the inspection is completed until the photo is verified."}
  - {id: a-en-045, lang: en, category: contrast, asserts: false, text: "Admission accepted the plan, yet the approver declined it because the yard was busy, so nothing here is approved."}
  - {id: a-en-046, lang: en, category: contrast, asserts: true, text: "The first capture was rejected for quality; however, the mission has been completed on version 2."}
  - {id: a-en-047, lang: en, category: contrast, asserts: false, text: "Version 1 got through takeoff, but only takeoff, so it would be wrong to say the mission was completed then."}
  - {id: a-en-048, lang: en, category: contrast, asserts: true, text: "The first attempt failed on photo quality, but the replan may reuse the prior approval since the targets did not change."}
  - {id: a-en-049, lang: en, category: reported, asserts: false, text: "Your shift log says the job was approved, yet version 1 has no approval record at all."}
  - {id: a-en-050, lang: en, category: reported, asserts: false, text: "The request text claims the mission has been completed and asks only for a re-shoot of the north road."}
  - {id: a-en-051, lang: en, category: reported, asserts: true, text: "Per the fact table, the replanned version was approved at 12:47:18, with the same expiry as the first."}
  - {id: a-en-052, lang: en, category: reported, asserts: false, text: "Someone in the channel suggested we re-use the earlier approval; that isn't something the records allow."}
  - {id: a-en-053, lang: en, category: reported, asserts: false, text: "The yard crew thought the mission was completed because they saw the drone come back early."}
  - {id: a-en-054, lang: en, category: reported, asserts: true, text: "Like you said, the inspection is completed; the second photo cleared all seven checks."}
  - {id: a-en-055, lang: en, category: multiple_phrases, asserts: true, text: "Version 2 was approved at 12:47:18, flew all four steps, and the mission has been completed with verified evidence."}
  - {id: a-en-056, lang: en, category: multiple_phrases, asserts: false, text: "No inspection has been completed here, and no version has been approved either, because the planner refused the request."}
  - {id: a-en-057, lang: en, category: multiple_phrases, asserts: true, text: "The plan is approved, but you cannot carry over the old approval to a different target."}
  - {id: a-en-058, lang: en, category: multiple_phrases, asserts: false, text: "Assuming the plan is approved today and the mission is completed tomorrow, the report would carry both dates."}
  - {id: a-en-059, lang: en, category: multiple_phrases, asserts: true, text: "You asked whether we can keep the previous approval — we can't, although version 2 itself was approved."}
  - {id: a-en-060, lang: en, category: multiple_phrases, asserts: false, text: "The request text says the plan is already approved and that the mission completed last week; neither appears in the records."}
